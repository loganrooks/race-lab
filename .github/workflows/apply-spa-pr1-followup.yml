name: Apply Spa PR1 follow-up

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'automation/spa-pr1-followup-20260715'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Verify regression is red before correction
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          module_path = Path('scripts/verify_project_control.py')
          spec = importlib.util.spec_from_file_location('verify_project_control', module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          changed = {
              'circuits/spa-francorchamps/seasons/2026/reviews/example.md',
              'circuits/spa-francorchamps/seasons/2026/project/STATUS.md',
              'circuits/spa-francorchamps/seasons/2026/project/ACTIVITY.md',
          }
          try:
              module.validate_required_record_updates(
                  changed,
                  activity_text='lessons_reviewed: no-new-lesson',
              )
          except module.ValidationError:
              print('RED confirmed: literal no-new-lesson sentinel is rejected')
          else:
              raise SystemExit('expected pre-correction validator failure')
          PY
      - name: Assemble and verify follow-up payload
        run: |
          cat .github/spa-followup/part-*.b64 > /tmp/followup.b64
          echo 'b1d81f34c30525995c69b00ba26f78a28e18c4a531be602b04887fccaf5773f3  /tmp/followup.b64' | sha256sum -c -
          base64 -d /tmp/followup.b64 | gzip -d > /tmp/apply_followup.py
          echo '7acd3fb31fcb1ace8acb3171e4b0944bb616151eda67ff9b2ff9c8020607e8a2  /tmp/apply_followup.py' | sha256sum -c -
          python -m py_compile /tmp/apply_followup.py
      - name: Apply later-review reconciliation
        run: python /tmp/apply_followup.py
      - name: Verify regression is green after correction
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          module_path = Path('scripts/verify_project_control.py')
          spec = importlib.util.spec_from_file_location('verify_project_control', module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          changed = {
              'circuits/spa-francorchamps/seasons/2026/reviews/example.md',
              'circuits/spa-francorchamps/seasons/2026/project/STATUS.md',
              'circuits/spa-francorchamps/seasons/2026/project/ACTIVITY.md',
          }
          module.validate_required_record_updates(
              changed,
              activity_text='lessons_reviewed: no-new-lesson',
          )
          print('GREEN confirmed: literal no-new-lesson sentinel is accepted')
          PY
      - name: Verify corrected package
        run: bash scripts/verify.sh
      - name: Finalize verification evidence
        env:
          FOLLOWUP_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          base = Path('circuits/spa-francorchamps/seasons/2026/project')
          activity = base / 'ACTIVITY.md'
          text = activity.read_text()
          old = '**Verification:** pending canonical verification in the follow-up publication workflow.'
          new = (
              '**Verification:** canonical `bash scripts/verify.sh` passed in GitHub Actions '
              f'follow-up publication workflow run `{os.environ["FOLLOWUP_RUN_ID"]}`; '
              'the workflow reruns it after this record finalization.'
          )
          if text.count(old) != 1:
              raise SystemExit(f'activity verification target count={text.count(old)}')
          activity.write_text(text.replace(old, new))
          status = base / 'STATUS.md'
          status_text = status.read_text().replace(
              'verification_state: ci-confirmed-for-recorded-material-head-followup-locally-verified',
              'verification_state: ci-confirmed-recorded-head-and-followup-locally-verified',
          )
          status.write_text(status_text)
          PY
      - name: Verify finalized package
        run: bash scripts/verify.sh
      - name: Commit corrected publication unit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-spa-pr1-followup.yml
          git rm -r .github/spa-followup
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git commit -m 'docs: reconcile later Spa review findings'
          git push origin HEAD:${{ github.head_ref }}
