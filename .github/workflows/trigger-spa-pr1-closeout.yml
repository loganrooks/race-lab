name: Trigger Spa PR1 closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'automation/spa-pr1-closeout-20260715'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Assemble and verify reconciliation payload
        run: |
          cat .github/spa-closeout/part-*.b64 > /tmp/apply-spa.b64
          echo 'e4cb6357e98737d1104bfe853742566b6273446a41b220ccdbbf2e7552803397  /tmp/apply-spa.b64' | sha256sum -c -
          base64 -d /tmp/apply-spa.b64 | gzip -d > /tmp/apply_spa_pr1_closeout.py
          echo 'ef10e0521035bd198e7fe006afa0f9a44240046a2db486a1a103d40097f2807f  /tmp/apply_spa_pr1_closeout.py' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_spa_pr1_closeout.py')
          text = path.read_text()
          old = '    replace_once(MODEL, insert_marker, control_block + insert_marker)\n'
          new = (
              '    model_text = MODEL.read_text(encoding="utf-8")\n'
              '    first_marker = model_text.find(insert_marker)\n'
              '    second_marker = model_text.find(insert_marker, first_marker + len(insert_marker))\n'
              '    if first_marker < 0 or second_marker < 0:\n'
              '        raise RuntimeError(f"{MODEL}: expected at least two LapSolution markers")\n'
              '    MODEL.write_text(model_text[:second_marker] + control_block + model_text[second_marker:], encoding="utf-8")\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'LapSolution patch target count={text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          echo '043402e56ad43c4f3fbb2e08e12561f1fd3b7abb08bf6f86c8071207aa89a2fb  /tmp/apply_spa_pr1_closeout.py' | sha256sum -c -
          python -m py_compile /tmp/apply_spa_pr1_closeout.py
      - name: Apply bounded reconciliation
        run: |
          set +e
          python /tmp/apply_spa_pr1_closeout.py > /tmp/spa-closeout-apply.log 2>&1
          status=$?
          set -e
          cat /tmp/spa-closeout-apply.log
          if [[ $status -ne 0 ]]; then
            cp /tmp/spa-closeout-apply.log .github/spa-closeout/diagnostic.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/spa-closeout/diagnostic.txt
            git commit -m 'chore: record Spa closeout diagnostic' || true
            git push origin HEAD:${{ github.head_ref }}
            exit $status
          fi
      - name: Verify corrected package
        run: bash scripts/verify.sh
      - name: Finalize records
        run: python /tmp/apply_spa_pr1_closeout.py --finalize
      - name: Verify finalized package
        run: bash scripts/verify.sh
      - name: Commit corrected publication unit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-spa-pr1-closeout.yml .github/workflows/trigger-spa-pr1-closeout.yml
          git rm -r .github/spa-closeout
          git add -A
          git commit -m 'docs: close Spa post-reconciliation review gaps'
          git push origin HEAD:${{ github.head_ref }}
