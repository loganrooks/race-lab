name: Export current Spa files

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'automation/export-spa-current-20260715'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Stage current files
        run: |
          mkdir -p /tmp/spa-current
          cp --parents \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-data-pipeline.md \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-model-prediction.md \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-app-integration.md \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-15-pr1-closeout-plan.md \
            circuits/spa-francorchamps/seasons/2026/project/README.md \
            circuits/spa-francorchamps/seasons/2026/project/STATUS.md \
            circuits/spa-francorchamps/seasons/2026/project/ACTIVITY.md \
            circuits/spa-francorchamps/seasons/2026/project/LESSONS.md \
            circuits/spa-francorchamps/seasons/2026/reviews/2026-07-15-plan-reconciliation.md \
            scripts/verify_project_control.py \
            tests/test_project_control.py \
            /tmp/spa-current/
      - uses: actions/upload-artifact@v4
        with:
          name: spa-current-head-76b8226
          path: /tmp/spa-current
          if-no-files-found: error
          retention-days: 1
