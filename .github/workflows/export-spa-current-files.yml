name: Export current Spa files

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'automation/export-spa-current-20260715'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Archive exact PR1 head
        run: git archive 76b8226e0e4365bf757300972174e5fe28319f1c -o /tmp/race-lab-head-76b8226.zip
      - uses: actions/upload-artifact@v4
        with:
          name: race-lab-head-76b8226
          path: /tmp/race-lab-head-76b8226.zip
          if-no-files-found: error
          retention-days: 1
