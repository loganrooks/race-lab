name: Reconcile Spa calibration plans

on:
  pull_request:
    branches:
      - chore/establish-race-lab-structure
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    if: github.head_ref == 'automation/spa-plan-reconciliation-20260715'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation payload
        uses: actions/checkout@v4
        with:
          ref: automation/spa-plan-reconciliation-20260715
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve payload and check out PR branch
        run: |
          cp -R .automation /tmp/race-lab-reconciliation-payload
          cp scripts/reconcile_spa_plans.py /tmp/reconcile_spa_plans.py
          git fetch origin chore/establish-race-lab-structure
          git checkout -B chore/establish-race-lab-structure origin/chore/establish-race-lab-structure
          cp -R /tmp/race-lab-reconciliation-payload .automation
          cp /tmp/reconcile_spa_plans.py scripts/reconcile_spa_plans.py

      - name: Install verification tooling
        run: python -m pip install --disable-pip-version-check ruff

      - name: Apply reconciliation package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/reconcile_spa_plans.py > /tmp/reconcile.log 2>&1
          status=$?
          cat /tmp/reconcile.log
          if (( status != 0 )); then
            {
              echo '### Reconciliation workflow diagnostic'
              echo
              echo '```text'
              cat /tmp/reconcile.log
              echo '```'
            } > /tmp/reconcile-comment.md
            gh pr comment 3 --body-file /tmp/reconcile-comment.md
            exit "$status"
          fi

      - name: Remove temporary publication files
        run: rm -rf .automation scripts/reconcile_spa_plans.py

      - name: Run canonical verification
        run: bash scripts/verify.sh

      - name: Assert exact publication scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-program.md',
              'circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-data-pipeline.md',
              'circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-model-prediction.md',
              'circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-app-integration.md',
              'circuits/spa-francorchamps/seasons/2026/reviews/2026-07-15-plan-reconciliation.md',
              'scripts/verify.sh',
          }
          changed = set(subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          unexpected = paths - allowed
          missing = allowed - paths
          if unexpected or missing:
              raise SystemExit(f'unexpected={sorted(unexpected)} missing={sorted(missing)}')
          print('publication scope verified')
          PY

      - name: Commit and push one consolidated revision
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-program.md \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-data-pipeline.md \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-model-prediction.md \
            circuits/spa-francorchamps/seasons/2026/plans/2026-07-14-spa-calibration-app-integration.md \
            circuits/spa-francorchamps/seasons/2026/reviews/2026-07-15-plan-reconciliation.md \
            scripts/verify.sh
          git commit -m 'docs: reconcile Spa calibration plans'
          git push origin HEAD:chore/establish-race-lab-structure
