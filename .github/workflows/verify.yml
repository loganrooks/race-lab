name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - chore/establish-race-lab-structure

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Run canonical verification
        run: bash scripts/verify.sh
