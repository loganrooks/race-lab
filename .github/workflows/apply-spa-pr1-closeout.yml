name: Apply Spa PR1 closeout

on:
  push:
    branches:
      - automation/spa-pr1-closeout-20260715
    paths:
      - .github/workflows/apply-spa-pr1-closeout.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Decode reconciliation script
        shell: bash
        run: |
          cat > /tmp/apply-spa.b64 <<'EOF'

EOF
          base64 -d /tmp/apply-spa.b64 | gzip -d > /tmp/apply_spa_pr1_closeout.py
          python -m py_compile /tmp/apply_spa_pr1_closeout.py
      - name: Apply bounded reconciliation
        run: python /tmp/apply_spa_pr1_closeout.py
      - name: Verify corrected package
        run: bash scripts/verify.sh
      - name: Finalize records
        run: python /tmp/apply_spa_pr1_closeout.py --finalize
      - name: Verify finalized package
        run: bash scripts/verify.sh
      - name: Commit corrected publication unit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-spa-pr1-closeout.yml
          git add -A
          git commit -m 'docs: close Spa post-reconciliation review gaps'
          git push origin HEAD
